<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0a0c1c"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>
    <linearGradient id="r0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6fdcff"/>
      <stop offset="100%" stop-color="#3a8fff"/>
    </linearGradient>
    <linearGradient id="r1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a90ff"/>
      <stop offset="100%" stop-color="#9070ff"/>
    </linearGradient>
    <linearGradient id="r2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b387ff"/>
      <stop offset="100%" stop-color="#cc60d6"/>
    </linearGradient>
    <linearGradient id="r3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e060c0"/>
      <stop offset="100%" stop-color="#ff5ad6"/>
    </linearGradient>
    <radialGradient id="ballGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#bfeaff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bfeaff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Outer square ring -->
  <rect x="78" y="78" width="356" height="356" fill="none" stroke="url(#r3)" stroke-width="14" rx="18"/>
  <!-- Hexagon ring -->
  <polygon points="256,118 374,188 374,324 256,394 138,324 138,188" fill="none" stroke="url(#r2)" stroke-width="13"/>
  <!-- Triangle ring -->
  <polygon points="256,162 354,332 158,332" fill="none" stroke="url(#r1)" stroke-width="12"/>
  <!-- Inner circle ring -->
  <circle cx="256" cy="256" r="62" fill="none" stroke="url(#r0)" stroke-width="11"/>
  <!-- Ball glow -->
  <circle cx="256" cy="256" r="44" fill="url(#ballGlow)"/>
  <!-- Ball core -->
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>
</svg>
